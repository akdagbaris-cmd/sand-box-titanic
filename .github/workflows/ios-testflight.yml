# iOS uygulamasını GitHub'ın Mac sunucusunda derler ve TestFlight'a yükler.
# Mac gerekmez: GitHub'da Actions sekmesi → "iOS TestFlight" → "Run workflow".
# Gerekli gizli anahtarlar (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   : 10 karakterlik Apple Team ID
#   ASC_KEY_ID      : App Store Connect API anahtarının Key ID'si
#   ASC_ISSUER_ID   : App Store Connect API Issuer ID
#   ASC_KEY_P8      : indirilen AuthKey_XXXX.p8 dosyasının tüm içeriği
# Ayrıntılar: docs/app-store-rehberi.md
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mağazada görünen sürüm (ör. 1.0, 1.1)"
        required: true
        default: "1.0"
      kilit:
        description: "Gizli kod ekranı açık kalsın mı? (App Store için hayır)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Gizli anahtarları kontrol et
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Eksik gizli anahtar(lar):$missing. Rehberdeki 4. adıma bak."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Oyunu iOS projesine kopyala
        env:
          KILIT: ${{ inputs.kilit && '1' || '0' }}
        run: |
          npm ci
          npm run ios:sync

      - name: API anahtarını yaz
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Derle ve arşivle (imzalama otomatik)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: App Store Connect'e yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Yüklendi: sürüm ${{ inputs.version }} (build ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "10-30 dakika içinde App Store Connect → TestFlight'ta görünür." >> "$GITHUB_STEP_SUMMARY"

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
